name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run repository policy checks
        run: bash tests/check_repo.sh
      - name: Run deterministic synthetic runtime harness
        run: node tests/gate2/synthetic-harness.mjs
